[project]
name = "acise-p2-cidt"
version = "0.1.0"
description = "ACISE Project 2: CI Build Failure Prediction using DT"
authors = [
    { name = "culbec", email = "profir.alexx@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "kaleido>=1.5.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "skops>=0.16.0",
]

[project.scripts]
collect-runs = "acise_p2_cidt.collect.gh_runs:main"
build-dataset = "acise_p2_cidt.data.build:main"
train-final = "acise_p2_cidt.validate.live:train_final_main"
retest = "acise_p2_cidt.validate.live:retest_main"
predict-run = "acise_p2_cidt.validate.live:predict_run_main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
