[project]
name = "ledger"
version = "0.1.0"
description = "Small inventory and pricing library: the CI sandbox of ACISE project 2"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
